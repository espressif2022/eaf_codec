version: "2.0.0"
description: "Unified ESP EAF & EAF4 (RGB565 / RGB565A8 / BGRA8888) Animation Codec and LVGL Player"
url: "https://github.com/espressif2022/eaf_codec"
license: "Apache-2.0"
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32p4
  - esp32s31
dependencies:
  idf: ">=5.0"
  espressif/zlib: ">=1.3.0"
  espressif/esp_new_jpeg:
    version: ">=0.5.0"
    optional: true
  espressif/esp_h264:
    version: ">=1.0.0"
    optional: true
